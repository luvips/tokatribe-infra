version: '3.9'

services:
  # ==========================================
  # 1. MONGODB (Base de Datos Principal)
  # ==========================================
  mongo:
    image: mongo:7
    container_name: tokatribe-mongo
    env_file:
      - .env
    command: mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_APP_DB: ${MONGO_APP_DB:-tokatribe}
    ports:
      # Zero Trust: Solo accesible desde el localhost del servidor VPS
      - "127.0.0.1:27017:27017"
    volumes:
      # Se mapea a la carpeta local data/ para persistencia segura
      - ./data/mongo:/data/db
      - ./secrets/mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - tokatribe_network
    restart: always

  # Inicializador automático del Replica Set (necesario para transacciones)
  mongo-init:
    image: mongo:7
    container_name: tokatribe-mongo-init
    env_file:
      - .env
    depends_on:
      - mongo
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_APP_DB: ${MONGO_APP_DB:-tokatribe}
    networks:
      - tokatribe_network
    volumes:
      - ./scripts/init-mongo.sh:/scripts/init-mongo.sh
    entrypoint: [ "bash", "/scripts/init-mongo.sh" ]

  # ==========================================
  # 2. REDIS (Caché y WebSockets)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: tokatribe-redis
    env_file:
      - .env
    # Forzamos autenticación con contraseña mediante variable de entorno
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      # Zero Trust: Solo accesible desde el localhost del servidor VPS
      - "127.0.0.1:6379:6379"
    volumes:
      # Se mapea a la carpeta local data/ para persistencia segura
      - ./data/redis:/data
    networks:
      - tokatribe_network
    restart: always

# ==========================================
# CONFIGURACIÓN DE RED
# ==========================================
networks:
  tokatribe_network:
    driver: bridge
    name: tokatribe_network
